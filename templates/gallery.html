<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e17; --glass: rgba(255,255,255,0.045); --glass-border: rgba(255,255,255,0.09);
    --glass-hi: rgba(255,255,255,0.09); --text: #eef1f7; --muted: #8a93a6;
    --teal: #5eead4; --violet: #a78bfa; --amber: #fbbf24; --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; overflow-x: hidden;
  }
  .ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.3; }
  .blob-1 { width: 460px; height: 460px; background: radial-gradient(circle, var(--teal), transparent 70%); top: -140px; left: -100px; animation: drift1 24s ease-in-out infinite; }
  .blob-2 { width: 500px; height: 500px; background: radial-gradient(circle, var(--violet), transparent 70%); bottom: -180px; right: -120px; animation: drift2 28s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(50px,70px) scale(1.12); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-60px,-40px) scale(1.08); } }

  .container { position: relative; z-index: 2; max-width: 1040px; margin: 0 auto; padding: 48px 24px 80px; }

  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 6px; }
  .logo-mark { width: 32px; height: 32px; }
  .logo-mark svg { width: 100%; height: 100%; display: block; }
  .brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 19px; }
  .brand-name span { color: var(--teal); }

  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(24px, 4vw, 30px); margin: 4px 0 0; letter-spacing: -0.02em; }

  nav.tabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 36px; }
  nav.tabs a { color: var(--muted); text-decoration: none; font-size: 13.5px; font-weight: 500; padding: 8px 16px; border-radius: 100px; transition: color 0.2s, background 0.2s; }
  nav.tabs a.active { color: var(--text); background: var(--glass); border: 1px solid var(--glass-border); }
  nav.tabs a:hover:not(.active) { color: var(--text); }
  nav.tabs a.logout-link { margin-left: 8px; color: var(--danger); opacity: 0.8; }
  nav.tabs a.logout-link:hover { opacity: 1; }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }

  .gallery-item {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 3/4;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    cursor: pointer;
    opacity: 0;
    animation: riseIn 0.5s cubic-bezier(.2,.8,.2,1) forwards;
    transition: transform 0.25s ease;
  }
  .gallery-item:hover { transform: translateY(-4px); }
  @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .gallery-item img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform 0.4s ease, filter 0.3s ease;
  }
  .gallery-item:hover img { transform: scale(1.06); filter: brightness(0.55); }

  .gallery-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 12px;
    background: linear-gradient(180deg, transparent 40%, rgba(10,14,23,0.92) 100%);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .gallery-item:hover .gallery-overlay { opacity: 1; }
  .gallery-overlay .merchant { font-size: 13px; font-weight: 600; font-family: 'Space Grotesk', sans-serif; }
  .gallery-overlay .amount { font-size: 12px; color: var(--teal); margin-top: 2px; font-weight: 600; }
  .gallery-overlay .date { font-size: 10.5px; color: var(--muted); margin-top: 4px; }

  .category-tag {
    position: absolute; top: 8px; left: 8px;
    background: rgba(10,14,23,0.7);
    backdrop-filter: blur(6px);
    border-radius: 100px;
    padding: 3px 9px;
    font-size: 10.5px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .empty-state { text-align: center; color: var(--muted); padding: 70px 20px; font-size: 14px; }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(5,7,12,0.88);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center; justify-content: center;
    padding: 30px;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .lightbox.show { display: flex; opacity: 1; }
  .lightbox-content {
    max-width: 480px; width: 100%;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: blur(24px);
    transform: scale(0.95);
    transition: transform 0.25s cubic-bezier(.2,.8,.2,1);
  }
  .lightbox.show .lightbox-content { transform: scale(1); }
  .lightbox-content img { width: 100%; max-height: 60vh; object-fit: contain; display: block; background: #000; }
  .lightbox-details { padding: 20px; }
  .lightbox-details .lb-row {
    display: flex; justify-content: space-between; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13.5px;
  }
  .lightbox-details .lb-row:last-child { border-bottom: none; }
  .lightbox-details .lb-label { color: var(--muted); }
  .lightbox-close {
    position: absolute; top: 18px; right: 22px;
    background: var(--glass); border: 1px solid var(--glass-border);
    width: 34px; height: 34px; border-radius: 50%;
    color: var(--text); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox-close:hover { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>

<div class="ambient">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<div class="container">
  <div class="brand">
    <div class="logo-mark">
      <svg viewBox="0 0 40 40" fill="none">
        <rect x="9" y="5" width="22" height="30" rx="3" stroke="url(#g1)" stroke-width="2"/>
        <path d="M13 13H27M13 19H27M13 25H21" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
        <defs><linearGradient id="g1" x1="9" y1="5" x2="31" y2="35"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
      </svg>
    </div>
    <div class="brand-name">Expense Tracker<span>.</span></div>
  </div>
  <header><h1>Receipt Gallery</h1></header>

  <nav class="tabs">
    <a href="/">Upload</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/gallery" class="active">Gallery</a>
    <a href="/logout" class="logout-link">Logout</a>
  </nav>

  <div class="gallery-grid" id="galleryGrid"></div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-close" onclick="closeLightbox()">✕</div>
  <div class="lightbox-content" id="lightboxContent"></div>
</div>

<script>
  const CATEGORY_ICONS = {
    "Food & Dining": "🍔", "Transport": "🚗", "Groceries": "🍎", "Shopping": "🛍️",
    "Utilities": "💡", "Healthcare": "🩺", "Entertainment": "🎬", "Uncategorized": "📦"
  };
  function getCategoryIcon(cat) { return CATEGORY_ICONS[cat] || "📦"; }

  let receiptsData = [];

  async function loadGallery() {
    const res = await fetch('/api/receipts');
    receiptsData = await res.json();
    const grid = document.getElementById('galleryGrid');

    if (receiptsData.length === 0) {
      grid.innerHTML = '<p class="empty-state">No receipts uploaded yet — head to the upload tab to get started</p>';
      return;
    }

    grid.innerHTML = receiptsData.map((r, i) => `
      <div class="gallery-item" style="animation-delay:${Math.min(i * 0.04, 0.4)}s" onclick="openLightbox(${i})">
        <span class="category-tag">${getCategoryIcon(r.category)} ${r.category}</span>
        <img src="${r.image_url}" alt="${r.merchant || 'Receipt'}" loading="lazy">
        <div class="gallery-overlay">
          <div class="merchant">${r.merchant || 'Unknown merchant'}</div>
          <div class="amount">${r.amount != null ? '₹' + r.amount.toFixed(2) : '—'}</div>
          <div class="date">${r.date || ''}</div>
        </div>
      </div>
    `).join('');
  }

  function openLightbox(index) {
    const r = receiptsData[index];
    document.getElementById('lightboxContent').innerHTML = `
      <img src="${r.image_url}" alt="${r.merchant || 'Receipt'}">
      <div class="lightbox-details">
        <div class="lb-row"><span class="lb-label">Merchant</span><span>${r.merchant || '—'}</span></div>
        <div class="lb-row"><span class="lb-label">Amount</span><span>${r.amount != null ? '₹' + r.amount.toFixed(2) : '—'}</span></div>
        <div class="lb-row"><span class="lb-label">Date</span><span>${r.date || '—'}</span></div>
        <div class="lb-row"><span class="lb-label">Category</span><span>${getCategoryIcon(r.category)} ${r.category}</span></div>
      </div>
    `;
    document.getElementById('lightbox').classList.add('show');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('show');
  }

  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox') closeLightbox();
  });

  loadGallery();
</script>
</body>
</html>

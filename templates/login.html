<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e17; --glass: rgba(255,255,255,0.045); --glass-border: rgba(255,255,255,0.09);
    --text: #eef1f7; --muted: #8a93a6; --teal: #5eead4; --violet: #a78bfa; --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center;
    overflow-x: hidden;
  }
  .ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.32; }
  .blob-1 { width: 460px; height: 460px; background: radial-gradient(circle, var(--teal), transparent 70%); top: -120px; left: -100px; animation: drift1 22s ease-in-out infinite; }
  .blob-2 { width: 500px; height: 500px; background: radial-gradient(circle, var(--violet), transparent 70%); bottom: -150px; right: -110px; animation: drift2 26s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(50px,60px) scale(1.12); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-60px,-40px) scale(1.08); } }

  .auth-box {
    position: relative; z-index: 2; width: 100%; max-width: 380px; padding: 24px;
    opacity: 0; animation: riseIn 0.7s cubic-bezier(.2,.8,.2,1) 0.1s forwards;
  }
  @keyframes riseIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 28px; }
  .logo-mark { width: 32px; height: 32px; }
  .brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 19px; }
  .brand-name span { color: var(--teal); }

  .glass-panel {
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 22px;
    padding: 32px; backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 30px 60px -30px rgba(0,0,0,0.6);
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700;
    margin: 0 0 6px; text-align: center; letter-spacing: -0.01em;
  }
  p.subtitle { color: var(--muted); font-size: 13.5px; text-align: center; margin: 0 0 26px; }

  label { font-size: 12.5px; color: var(--muted); font-weight: 500; display: block; margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  input {
    width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border);
    border-radius: 12px; padding: 12px 14px; color: var(--text); font-size: 14px;
    font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s;
  }
  input:focus { border-color: var(--teal); }

  button.submit-btn {
    width: 100%; margin-top: 8px; padding: 13px; border: none; border-radius: 14px;
    background: linear-gradient(100deg, var(--teal), var(--violet)); color: #0a0e17;
    font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; font-weight: 600;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.25s;
    box-shadow: 0 10px 30px -10px rgba(94,234,212,0.35);
  }
  button.submit-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px -10px rgba(167,139,250,0.45); }

  .error-msg {
    background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.25);
    color: var(--danger); font-size: 13px; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
  }

  .switch-link { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--muted); }
  .switch-link a { color: var(--teal); text-decoration: none; font-weight: 600; }
  .switch-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="ambient">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<div class="auth-box">
  <div class="brand">
    <div class="logo-mark">
      <svg viewBox="0 0 40 40" fill="none">
        <rect x="9" y="5" width="22" height="30" rx="3" stroke="url(#g1)" stroke-width="2"/>
        <path d="M13 13H27M13 19H27M13 25H21" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
        <defs><linearGradient id="g1" x1="9" y1="5" x2="31" y2="35"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
      </svg>
    </div>
    <div class="brand-name">Expense Tracker<span>.</span></div>
  </div>

  <div class="glass-panel">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to your expense dashboard</p>

    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="submit-btn">Log In</button>
    </form>

    <div class="switch-link">Don't have an account? <a href="/register">Sign up</a></div>
  </div>
</div>

</body>
</html>
